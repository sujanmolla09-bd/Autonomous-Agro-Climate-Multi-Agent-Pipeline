apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: autonomous-agro-climate-pipeline
  namespace: ml-consumer-smart-agro-14eea
  labels:
    ://googleapis.com: us-west1 # ওরেগন ক্লাউড রিজিওন সিঙ্ক
spec:
  template:
    spec:
      containers:
        - image: gcr.io/ml-consumer-smart-agro-14eea/autonomous-pipeline:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 512Mi # ৩ জিবি র‍্যামের মোবাইলের সাথে সামঞ্জস্যপূর্ণ লাইটওয়েট স্কেলিং
              cpu: "1"
